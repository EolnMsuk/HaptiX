name: Compile & Release Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

defaults:
  run:
    shell: bash

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          version=$(awk '$1 == "Version:" { sub(/\r$/, ""); print $2 }' control)
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "Expected one Version field in control." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.variant }}
    needs: metadata
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rootless
            scheme: rootless
            package_arch: iphoneos-arm64
            sdk: '16.5'
            minimum_ios: '15.0'
            altlist: AltList_New.framework
          - variant: roothide
            scheme: roothide
            package_arch: iphoneos-arm64e
            sdk: '16.5'
            minimum_ios: '15.0'
            altlist: AltList_Roothide.framework
          - variant: rootful
            scheme: ''
            package_arch: iphoneos-arm
            sdk: '16.5'
            minimum_ios: '15.0'
            altlist: AltList_New.framework
          - variant: legacy
            scheme: ''
            package_arch: iphoneos-arm
            sdk: '14.5'
            minimum_ios: '13.0'
            altlist: AltList_Old.framework
    env:
      VARIANT: ${{ matrix.variant }}
      PACKAGE_SCHEME: ${{ matrix.scheme }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      SDK_VERSION: ${{ matrix.sdk }}
      MINIMUM_IOS: ${{ matrix.minimum_ios }}
      ALTLIST_FRAMEWORK: ${{ matrix.altlist }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Theos and host tools
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Select Theos toolchain and SDK
        run: |
          stock_theos="${THEOS:?The bootstrap did not set THEOS}"
          active_theos="$stock_theos"
          if [[ "$PACKAGE_SCHEME" == roothide ]]; then
            active_theos="$RUNNER_TEMP/theos-roothide"
            git clone --recurse-submodules https://github.com/roothide/theos.git "$active_theos"
          fi

          sdk_name="iPhoneOS${SDK_VERSION}.sdk"
          sdk="$active_theos/sdks/$sdk_name"
          if [[ ! -d "$sdk" ]]; then
            mkdir -p "$active_theos/sdks"
            if [[ -d "$stock_theos/sdks/$sdk_name" ]]; then
              ln -s "$stock_theos/sdks/$sdk_name" "$sdk"
            else
              archive="$RUNNER_TEMP/$sdk_name.tar.xz"
              curl --fail --silent --show-error --location --retry 3 \
                --output "$archive" "https://github.com/theos/sdks/releases/latest/download/$sdk_name.tar.xz"
              tar -xf "$archive" -C "$active_theos/sdks"
            fi
          fi
          if [[ ! -d "$sdk/System/Library/Frameworks" ]]; then
            echo "Missing or incomplete SDK at $sdk" >&2
            exit 1
          fi

          xcodebuild -version
          printf 'Using Theos at %s with %s\n' "$active_theos" "$sdk"
          printf 'THEOS=%s\nSYSROOT=%s\n' "$active_theos" "$sdk" >> "$GITHUB_ENV"
          printf '%s\n' "$active_theos/bin" >> "$GITHUB_PATH"

      - name: Ensure dpkg-deb is available
        run: |
          if ! command -v dpkg-deb >/dev/null; then
            brew install dpkg
          fi

      - name: Select vendored AltList
        run: |
          rm -rf vendor/AltList.framework
          cp -R "vendor/$ALTLIST_FRAMEWORK" vendor/AltList.framework

      - name: Check legacy AltList linker compatibility
        if: matrix.variant == 'legacy'
        run: |
          probe=(
            xcrun --sdk iphoneos clang
            -arch arm64 -arch arm64e -isysroot "$SYSROOT" "-miphoneos-version-min=$MINIMUM_IOS"
            -F "$PWD/vendor" -framework AltList -Wl,-u,'_OBJC_CLASS_$_ATLApplicationListMultiSelectionController'
            -bundle -x c /dev/null -o "$RUNNER_TEMP/altlist-link-probe.bundle"
          )
          log="$RUNNER_TEMP/altlist-link-probe.log"
          if "${probe[@]}" > "$log" 2>&1; then
            cat "$log"
          else
            cat "$log" >&2
            echo "Retrying with a text stub for the legacy rootful AltList interface."
            rm vendor/AltList.framework/AltList
            cat > vendor/AltList.framework/AltList.tbd <<'TBD'
          --- !tapi-tbd
          tbd-version: 4
          targets: [ arm64-ios, arm64e-ios ]
          install-name: '/Library/Frameworks/AltList.framework/AltList'
          current-version: 0.0.0
          compatibility-version: 0.0.0
          exports:
            - targets: [ arm64-ios, arm64e-ios ]
              objc-classes: [ ATLApplicationListMultiSelectionController ]
          ...
          TBD
            "${probe[@]}"
          fi

      - name: Build package
        run: |
          if [[ "$PACKAGE_ARCH" != iphoneos-arm ]]; then
            sed "s/^Architecture:.*/Architecture: $PACKAGE_ARCH/" control > "$RUNNER_TEMP/haptix-control"
            mv "$RUNNER_TEMP/haptix-control" control
          fi

          make_args=(
            FINALPACKAGE=1
            "SYSROOT=$SYSROOT"
            "TARGET=iphone:clang:$SDK_VERSION:$MINIMUM_IOS"
            "ARCHS=arm64 arm64e"
          )
          unset THEOS_PACKAGE_SCHEME
          if [[ -n "$PACKAGE_SCHEME" ]]; then
            make_args+=("THEOS_PACKAGE_SCHEME=$PACKAGE_SCHEME")
          fi
          rm -f packages/*.deb
          make package "${make_args[@]}"

      - name: Verify and name package
        id: package
        run: |
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            echo "Expected exactly one freshly built .deb, found ${#packages[@]}." >&2
            exit 1
          fi

          bash .github/scripts/verify-package.sh "${packages[0]}" "$VARIANT" "$PACKAGE_ARCH" "$VERSION" "$MINIMUM_IOS"
          mkdir -p output
          asset="output/com.eolnmsuk.HaptiX_${VERSION}_${VARIANT}.deb"
          mv "${packages[0]}" "$asset"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HaptiX-${{ matrix.variant }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: HaptiX-*
          path: output
          merge-multiple: true

      - name: Verify draft asset names
        run: |
          expected=(
            "com.eolnmsuk.HaptiX_${VERSION}_rootless.deb"
            "com.eolnmsuk.HaptiX_${VERSION}_roothide.deb"
            "com.eolnmsuk.HaptiX_${VERSION}_rootful.deb"
            "com.eolnmsuk.HaptiX_${VERSION}_legacy.deb"
          )
          diff -u \
            <(printf 'f %s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(find output -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort)

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-b${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: HaptiX v${{ env.VERSION }}
          files: |
            output/com.eolnmsuk.HaptiX_${{ env.VERSION }}_rootless.deb
            output/com.eolnmsuk.HaptiX_${{ env.VERSION }}_roothide.deb
            output/com.eolnmsuk.HaptiX_${{ env.VERSION }}_rootful.deb
            output/com.eolnmsuk.HaptiX_${{ env.VERSION }}_legacy.deb
          fail_on_unmatched_files: true
          draft: true
          body: |
            Automated builds of HaptiX v${{ env.VERSION }}.

            | File | Install on |
            | --- | --- |
            | `com.eolnmsuk.HaptiX_${{ env.VERSION }}_rootless.deb` | iOS 15–17 rootless jailbreaks such as Dopamine 2 or palera1n rootless |
            | `com.eolnmsuk.HaptiX_${{ env.VERSION }}_roothide.deb` | iOS 15–16 on supported RootHide jailbreaks. Install directly in your package manager. |
            | `com.eolnmsuk.HaptiX_${{ env.VERSION }}_rootful.deb` | iOS 15–17 rootful jailbreaks such as palera1n rootful |
            | `com.eolnmsuk.HaptiX_${{ env.VERSION }}_legacy.deb` | iOS 13–14 rootful jailbreaks such as checkra1n or unc0ver |
