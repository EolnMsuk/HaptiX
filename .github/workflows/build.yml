name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Fix Line Endings
        run: |
          brew install dos2unix
          dos2unix control

      - name: Extract Version
        id: version
        run: echo "version=$(grep '^Version:' control | awk '{print $2}')" >> $GITHUB_OUTPUT

      # ── Build 1: Rootless (iOS 15+, new AltList) ──────────────────────────
      - name: Build Rootless Package
        run: make package FINALPACKAGE=1

      - name: Stage Rootless .deb
        run: |
          mkdir -p dist
          cp packages/*.deb "dist/HaptiX-${{ steps.version.outputs.version }}-rootless.deb"

      - name: Clean Build Artifacts
        run: make clean && rm -f packages/*.deb

      # ── Build 2: Rootful (iOS 15+, new AltList) ───────────────────────────
      - name: Build Rootful Package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=

      - name: Stage Rootful .deb
        run: |
          cp packages/*.deb "dist/HaptiX-${{ steps.version.outputs.version }}-rootful.deb"

      - name: Clean Build Artifacts (pre-legacy)
        run: make clean && rm -f packages/*.deb

      # ── Build 3: Rootful Legacy (iOS 13–14, old AltList) ──────────────────
      - name: Prepare Legacy AltList Framework
        run: |
          mkdir -p vendor/legacy
          cp -r vendor/AltList_Old.framework vendor/legacy/AltList.framework
          # Strip the arm64e slice — its fat-header entry says arm64e but the
          # slice itself uses the old ABI (arm64e.old), which Xcode 15+ linkers
          # reject even when linking arm64. Legacy targets only need arm64.
          lipo vendor/legacy/AltList.framework/AltList \
            -remove arm64e \
            -output vendor/legacy/AltList.framework/AltList

      - name: Build Rootful Legacy Package
        run: make -f Makefile.legacy package FINALPACKAGE=1

      - name: Stage Rootful Legacy .deb
        run: |
          cp packages/*.deb "dist/HaptiX-${{ steps.version.outputs.version }}-rootful-legacy.deb"

      - name: Clean Build Artifacts (post-legacy)
        run: make clean && rm -f packages/*.deb

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Rootless .deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaptiX-Rootless-Deb
          path: dist/*-rootless.deb

      - name: Upload Rootful .deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaptiX-Rootful-Deb
          path: dist/*-rootful.deb

      - name: Upload Rootful Legacy .deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaptiX-Rootful-Legacy-Deb
          path: dist/*-rootful-legacy.deb

      # ── Draft Release ──────────────────────────────────────────────────────
      - name: Create Draft Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: HaptiX ${{ steps.version.outputs.version }}
          draft: true
          make_latest: false
          files: dist/*.deb
          generate_release_notes: false
          body: |
            ## HaptiX ${{ steps.version.outputs.version }}

            System-wide haptic feedback tweak for iOS 13–17. Adds configurable haptics to taps, scrolls, and SpringBoard hardware buttons — with per-app exclusions and live preference reload.

            ---

            ## Which .deb should I install?

            | Package | Jailbreak | iOS | Notes |
            |---|---|---|---|
            | `HaptiX-${{ steps.version.outputs.version }}-rootless.deb` | Dopamine 2, Palera1n (rootless mode), RootHide | iOS 15 – 17 | Installs to `/var/jb` · new AltList |
            | `HaptiX-${{ steps.version.outputs.version }}-rootful.deb` | Palera1n (rootful mode) | iOS 15 – 17 | Installs to `/` · new AltList |
            | `HaptiX-${{ steps.version.outputs.version }}-rootful-legacy.deb` | Unc0ver, Checkra1n, Electra | iOS 13 – 14 | Installs to `/` · legacy AltList |

            > **Not sure which to use?**
            > - If your jailbreak places tweaks under `/var/jb/…` → **rootless**
            > - If you're on iOS 15+ with a rootful jailbreak → **rootful**
            > - If you're on iOS 13 or 14 → **rootful-legacy**

            ---

            ### Requirements
            - MobileSubstrate (Substitute / libhooker / ElleKit)
            - PreferenceLoader
            - [AltList](https://github.com/opa334/AltList) (`com.opa334.altlist`) — legacy builds require an older AltList version compatible with iOS 13–14
