name: Build iOS Tweak

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Fix Line Endings
        run: |
          brew install dos2unix
          dos2unix control

      - name: Build Rootless Package
        run: make package FINALPACKAGE=1

      - name: Stage Rootless .deb
        run: |
          mkdir -p dist
          for f in packages/*.deb; do
            cp "$f" "dist/$(basename "${f%.deb}")-rootless.deb"
          done

      - name: Clean Build Artifacts
        run: make clean

      - name: Build Rootful Package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=

      - name: Stage Rootful .deb
        run: |
          for f in packages/*.deb; do
            cp "$f" "dist/$(basename "${f%.deb}")-rootful.deb"
          done

      - name: Upload Rootless .deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaptiX-Rootless-Deb
          path: dist/*-rootless.deb

      - name: Upload Rootful .deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaptiX-Rootful-Deb
          path: dist/*-rootful.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: false
          body: "See CHANGELOG.md for details."
